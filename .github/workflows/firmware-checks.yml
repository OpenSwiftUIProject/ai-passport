name: Firmware checks

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "plays/**"
      - "skills/**"
      - "*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "plays/**"
      - "skills/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: ESP-IDF 5.5.3 firmware
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/setup-embedded
        with:
          firmware: 'true'

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ci-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ci-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and verify merged firmware
        run: ./tools/with-env.sh ./tools/validate.sh --firmware

      - name: Upload verified firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-${{ github.run_id }}
          path: build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error
          retention-days: 7
